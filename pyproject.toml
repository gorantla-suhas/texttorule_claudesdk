[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texttorule-engine"
version = "0.1.0"
description = "Telecom Rule Engine: converts natural language campaign rules into structured JSON using a Claude SDK centric architecture."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TextToRule Team" }]

dependencies = [
    # --- Web / API ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",

    # --- Claude Agent SDK ---
    # The Claude Agent SDK is the runtime that hosts the orchestrator agent.
    # Python tools are exposed to the agent via the in-process MCP server it creates.
    "claude-agent-sdk>=0.0.10",

    # --- Data / retrieval ---
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    # Local lexical / vector search; no external service required for v1.
    # Swap with sentence-transformers or a hosted embedding API later.

    # --- Observability ---
    # Langfuse via OpenTelemetry for tracing the agent and tool spans.
    "langfuse>=2.40",
    "openinference-instrumentation-claude-agent-sdk>=0.1.0",

    # --- Utilities ---
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]
embeddings = [
    # Optional local embedding backend. Used only if EMBEDDING_BACKEND=sentence-transformers.
    "sentence-transformers>=2.7",
    "chromadb>=0.5",
]

[project.scripts]
# CLI entry point: `rule-engine "give 5GB data to high-value prepaid users tomorrow"`
"rule-engine" = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
